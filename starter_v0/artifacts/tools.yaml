# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng khi thiếu thông tin hoặc khi cần xin xác nhận."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi gửi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi yêu cầu điền/cung cấp thêm thông tin thiếu; 'yes_no' khi cần xin xác nhận đồng ý/từ chối trước khi hành động"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type là choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter cụ thể (dùng screenname/handle như 'sama')."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản Twitter handle (ví dụ 'sama')"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội Twitter theo từ khóa hoặc chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet. Đặt topic='news' khi tìm kiếm tin tức hoặc thời sự."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm ngắn gọn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Đặt 'news' nếu tìm tin tức; 'general' cho tìm kiếm chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Fetch and read content from a specific URL. Use when the user provides a direct link to an article or page."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The full URL to fetch content from"}
      required: [url]

  - name: format
    description: "Format existing data into a readable text output (brief, sections, bullets, etc.)."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output format template"}
        headline: {type: string, default: "", description: "Headline/title for the output"}
      required: [items, template]

  - name: keywords
    description: "Trích từ khóa từ chính văn bản người dùng đã cung cấp. Chỉ dùng khi người dùng yêu cầu lấy từ khóa, tag hoặc chủ đề từ một đoạn text có sẵn; không dùng để tìm web, đọc URL hay thay cho lookup."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản nguồn phải được người dùng cung cấp nguyên văn"}
        max_keywords: {type: integer, default: 8, minimum: 1, maximum: 20, description: "Số từ khóa tối đa"}
        min_length: {type: integer, default: 3, minimum: 2, maximum: 12, description: "Độ dài tối thiểu của từ"}
      required: [text]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send a text message (e.g., to Telegram). Only use after the user has confirmed. Always ask for confirmation first via clarify."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The message content to send"}
        confirmed: {type: boolean, default: false, description: "Confirmation flag — must be true; ask user first"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents. Use for questions about company rules, AI research policy, data privacy, etc."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query about the policy"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area to search in"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: papers
    description: "Search for academic papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keywords"}
        max_results: {type: integer, default: 5, description: "Number of results"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order"}
      required: [query]

  - name: paper_text
    description: "Extract text content from an arXiv paper URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ArXiv URL or ID"}
        max_pages: {type: integer, default: 5, description: "Max pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Max characters to return"}
      required: [arxiv_url]

  # ---------------- Team Custom New Tools (Bonus) ----------------
  - name: weather_forecast
    description: "Tra cứu thời tiết hiện tại và dự báo thời tiết cho một vị trí/thành phố."
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "Tên thành phố hoặc vị trí (ví dụ 'Hanoi', 'Tokyo')"}
        days: {type: integer, default: 1, description: "Số ngày dự báo (1 đến 7)"}
      required: [location]

  - name: currency_convert
    description: "Quy đổi tỷ giá ngoại tệ giữa hai đồng tiền (ví dụ USD sang VND)."
    parameters:
      type: object
      properties:
        from_currency: {type: string, default: "USD", description: "Mã đồng tiền gốc (ví dụ 'USD', 'EUR')"}
        to_currency: {type: string, default: "VND", description: "Mã đồng tiền đích (ví dụ 'VND', 'USD')"}
        amount: {type: number, default: 1.0, description: "Số tiền cần quy đổi"}
      required: [from_currency, to_currency]

  - name: crypto_price
    description: "Tra cứu giá tiền mã hóa (Bitcoin, Ethereum, Solana...) theo thời gian thực."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "", description: "Tên tiền mã hóa (ví dụ 'bitcoin', 'ethereum', 'solana')"}
        currency: {type: string, default: "usd", description: "Đơn vị tiền tệ quy đổi (ví dụ 'usd', 'vnd')"}
      required: [symbol]
