# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for missing information. Use this when a request lacks a required detail (e.g., Twitter handle, URL, confirmation). Do NOT guess — ask."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected response format: text for open input, yes_no for confirmation, choice for options"}
        options: {type: array, default: [], items: {type: string}, description: "Options list for choice response_type"}
      required: [question]

  - name: timeline
    description: "Get recent posts/tweets from a specific user's timeline. Use for tweets OF a person, not tweets about a topic."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "The user's Twitter handle (e.g., sama, elonmusk, karpathy)"}
        limit: {type: integer, default: 5, description: "Number of tweets to retrieve"}
      required: [screenname]

  - name: social_search
    description: "Search for posts/tweets about a topic on social media. Use for tweets ABOUT a topic, not from a specific person."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keyword or phrase"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sort order: Latest for recent, Top for popular"}
        limit: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: lookup
    description: "Search the web for news or general information. Use for web searches including news articles."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query (topic only, do not include type like 'news')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Category: news for current events, general for other web info"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time range: day for hôm nay, week for tuần này, etc."}
        max_results: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: fetch
    description: "Fetch and read content from a specific URL. Use when the user provides a direct link to an article or page."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The full URL to fetch content from"}
      required: [url]

  - name: format
    description: "Format existing data into a readable text output (brief, sections, bullets, etc.)."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output format template"}
        headline: {type: string, default: "", description: "Headline/title for the output"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send a text message (e.g., to Telegram). Only use after the user has confirmed. Always ask for confirmation first via clarify."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The message content to send"}
        confirmed: {type: boolean, default: false, description: "Confirmation flag — must be true; ask user first"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents. Use for questions about company rules, AI research policy, data privacy, etc."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query about the policy"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area to search in"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: papers
    description: "Search for academic papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keywords"}
        max_results: {type: integer, default: 5, description: "Number of results"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order"}
      required: [query]

  - name: paper_text
    description: "Extract text content from an arXiv paper URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ArXiv URL or ID"}
        max_pages: {type: integer, default: 5, description: "Max pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Max characters to return"}
      required: [arxiv_url]
